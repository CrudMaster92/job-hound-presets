name: Trusted scraper validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: trusted-scraper-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only main's validator, dependencies, workflows and runtime execute.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r validation-requirements.txt
      - name: Check immutable canonical runtime
        env:
          PYTHONPATH: validation-runtime
        run: python -m server.public_jobs.export --destination validation-runtime --source validation-runtime --check
      - name: Fetch candidate as data and validate exact current base/head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: validation-runtime
        run: |
          git fetch origin main "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          python -m server.contributions.cli --repo . --base "$(git rev-parse origin/main)" \
            --head "$HEAD_SHA" --pr "$PR_NUMBER" \
            --runtime-manifest validation-runtime/runtime-manifest.json --output receipt.json
      - name: Preserve exact validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scraper-receipt
          path: receipt.json
          if-no-files-found: error
          retention-days: 7
  receipt:
    concurrency:
      group: trusted-receipt-publication
      cancel-in-progress: false
    needs: validate
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scraper-receipt
      - name: Store report on the fixed trusted receipt branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/publish_validation_receipt.py
