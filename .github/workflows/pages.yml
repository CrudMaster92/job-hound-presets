name: Build and deploy catalog
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip, cache-dependency-path: validation-requirements.txt}
      - run: python -m pip install -r validation-requirements.txt
      - name: Read trusted receipt branch
        run: |
          mkdir .receipts
          if git ls-remote --exit-code origin refs/heads/review-receipts; then
            git fetch --depth 1 origin review-receipts
            git archive FETCH_HEAD receipts | tar -x -C .receipts
          fi
      - name: Publish only effective trusted verification
        env:
          PYTHONPATH: validation-runtime
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m server.contributions.admission --catalog . --receipts .receipts \
            --runtime-manifest validation-runtime/runtime-manifest.json --output admission.json
          python scripts/build_catalog.py --output _site --source-commit "$GITHUB_SHA" --admission admission.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with: {path: _site}
  deploy:
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
